# Bibliocraft Legacy for Horizon — one flat SDK package (mod API 0.2).
#
# Slice 1 is four furniture blocks — the oak bookcase, the oak shelf, the black
# oak seat and the desk bell — with their states, shapes, items, drops, recipes,
# tags and one creative tab. Slice 2 makes the two wood blocks storage: the
# bookcase a 16-slot, books-only block entity whose redstone book answers a
# comparator by slot index, the shelf a plain 4-slot one, both with a content
# menu, hopper access and contents that spill when broken, plus the
# `redstone_book` item. The models are the upstream MIT assets; the
# planks/wool/iron/stone textures they reference are vanilla's, so the package
# ships no textures of its own. The seat entity, the desk bell's sound and
# redstone answers, the table and the bookcase's enchanting-table bonus (its
# hook is not dispatched at this pin) are deferred (notes.md).
#
# Licence: MIT, read from the upstream repository's `LICENSE` (rank 0,
# permissive). `LICENSE` and `LICENSE-NOTICE.md` travel inside the package.
# Local-only until the maintainer approves publishing (ARCHITECTURE.md §8).
id = "bibliocraft"
name = "Bibliocraft Legacy"
# The port's own version, not the original mod's 26.1.2-1.7.1: this is the first
# publication of the SDK package (there was no `.hnmod` submission to supersede).
version = "0.2.3"
description = """A port of Bibliocraft Legacy for Horizon. Slice 1 carries the oak bookcase, the oak
shelf, the black oak seat and the desk bell with their block states (facing and waterlogged, the
seat's occupied), their shapes transcribed from upstream, their items, self-drop loot, the upstream
recipes, the block and item tags and one Bibliocraft creative tab. Slice 2 makes the bookcase a
16-slot, books-only container opened by a click, whose redstone books answer a comparator by slot
index, and the shelf a plain 4-slot one; both reach hoppers on every face and spill their contents
when broken, and the redstone book item arrives with its shapeless recipe. The seat entity, the
desk bell's bell sound and redstone answers, the bookcase's enchanting-table bonus, the other 11 wood
types and 15 seat colours, and the table are not ported yet."""
authors = ["Minecraftschurli", "IchHabeHunger54", "AdLf0208"]
# The content API line: exact and checked. This package carries content beside
# its (test-only) model, so the capability is a real claim; it is also the one
# value the manifest schema has.
api = "0.2"
# The installation side, not the hook's: an integrated server belongs to the
# client installation, so a LAN host or a single-player world needs both.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob
# effects and entity types"): this mod declares four blocks, their items, the
# recipes, loot, tags and the creative tab.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
