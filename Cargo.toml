[package]
# Port of Bibliocraft Legacy 26.1.2-1.7.1 (MinecraftschurliMods/Bibliocraft-Legacy,
# MIT). The four furniture blocks are declared in `data/` and `assets/` at the
# package root; slice 2 adds the two storage block entities, their content menus
# and the redstone book item. `src/runtime.rs` is the pure model and its rules
# (shapes, slot counts, the comparator signal); `src/support.rs` is the game
# glue. The models are the upstream mod's own MIT assets. Local-only until
# publishing is approved (ARCHITECTURE.md §8).
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "bibliocraft"
version = "0.2.3"
edition = "2024"
license = "MIT"
description = "Bibliocraft Legacy's plain furniture slice for Horizon: bookcase, shelf, seat and desk bell"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
